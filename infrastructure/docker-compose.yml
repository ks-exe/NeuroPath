# Local development stack (R3.3). No cloud resources. Run from the repo root:
#   docker compose -f infrastructure/docker-compose.yml up --build
# Values below are local-only defaults; override through the shell or an .env file.
name: neuropath

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuropath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuropath}
      POSTGRES_DB: ${POSTGRES_DB:-neuropath}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # The ENGINE worker runs in-process inside this container (A-27).
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: local
      PLATFORM_PHASE: ${PLATFORM_PHASE:-1}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neuropath}:${POSTGRES_PASSWORD:-neuropath}@postgres:5432/${POSTGRES_DB:-neuropath}
      LOCAL_STORAGE_PATH: /data/storage
      LOCAL_OUTBOX_PATH: /data/outbox/outbox.jsonl
    volumes:
      - local-storage:/data/storage
      - local-outbox:/data/outbox
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-only. The browser never receives this value.
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  local-storage:
  local-outbox:
